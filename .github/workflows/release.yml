name: Release theme

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: 1.0.${{ github.run_number }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip jq xmlstarlet shellcheck

      - name: Validate release scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          shellcheck scripts/*.sh
          bash scripts/test-release.sh

      - name: Package the theme
        run: |
          bash scripts/package-theme.sh --version "$RELEASE_VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/publish-release.sh --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT"
